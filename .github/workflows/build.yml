name: Build ttlq

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build libs (arm64)
        run: |
          set -e
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          PREFIX=$PWD/deps-arm64/install
          mkdir -p deps-arm64 && cd deps-arm64

          git clone --depth 1 https://git.netfilter.org/libmnl
          cd libmnl
          ./autogen.sh
          ./configure --host=aarch64-linux-android --prefix=$PREFIX --disable-static --enable-shared
          make -j$(nproc)
          make install
          cd ..

          git clone --depth 1 https://git.netfilter.org/libnfnetlink
          cd libnfnetlink
          ./autogen.sh
          PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig ./configure --host=aarch64-linux-android --prefix=$PREFIX --disable-static --enable-shared
          make -j$(nproc)
          make install
          cd ..

          git clone --depth 1 https://git.netfilter.org/libnetfilter_queue
          cd libnetfilter_queue
          ./autogen.sh
          PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig ./configure --host=aarch64-linux-android --prefix=$PREFIX --disable-static --enable-shared
          make -j$(nproc)
          make install

      - name: Build libs (arm)
        run: |
          set -e
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi30-clang
          export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          PREFIX=$PWD/deps-arm/install
          mkdir -p deps-arm && cd deps-arm

          git clone --depth 1 https://git.netfilter.org/libmnl
          cd libmnl
          ./autogen.sh
          ./configure --host=arm-linux-androideabi --prefix=$PREFIX --disable-static --enable-shared
          make -j$(nproc)
          make install
          cd ..

          git clone --depth 1 https://git.netfilter.org/libnfnetlink
          cd libnfnetlink
          ./autogen.sh
          PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig ./configure --host=arm-linux-androideabi --prefix=$PREFIX --disable-static --enable-shared
          make -j$(nproc)
          make install
          cd ..

          git clone --depth 1 https://git.netfilter.org/libnetfilter_queue
          cd libnetfilter_queue
          ./autogen.sh
          PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig ./configure --host=arm-linux-androideabi --prefix=$PREFIX --disable-static --enable-shared
          make -j$(nproc)
          make install

      - name: Compile ttlq arm64
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang \
            -O2 -s \
            -I$PWD/deps-arm64/install/include \
            ttlq.c -o ttlq_arm64 \
            -L$PWD/deps-arm64/install/lib -lnetfilter_queue -lnfnetlink -lmnl

      - name: Compile ttlq arm
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi30-clang \
            -O2 -s \
            -I$PWD/deps-arm/install/include \
            ttlq.c -o ttlq_arm \
            -L$PWD/deps-arm/install/lib -lnetfilter_queue -lnfnetlink -lmnl

      - name: Collect shared libs
        run: |
          mkdir -p out
          cp ttlq_arm out/ttlq_arm
          cp ttlq_arm64 out/ttlq_arm64
          cp -P deps-arm64/install/lib/libmnl.so* out/ 2>/dev/null || true
          cp -P deps-arm64/install/lib/libnfnetlink.so* out/ 2>/dev/null || true
          cp -P deps-arm64/install/lib/libnetfilter_queue.so* out/ 2>/dev/null || true
          cp -P deps-arm/install/lib/libmnl.so* out/ 2>/dev/null || true
          cp -P deps-arm/install/lib/libnfnetlink.so* out/ 2>/dev/null || true
          cp -P deps-arm/install/lib/libnetfilter_queue.so* out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ttlq-binaries
          path: out/*
