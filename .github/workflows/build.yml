name: Build ttlq

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for arm64-v8a
        uses: nttld/setup-ndk@v1
        id: ndk_arm64
        with:
          ndk-version: r26b

      - name: Compile arm64
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang \
            -O2 -s -static \
            ttlq.c -o ttlq_arm64 \
            -lnetfilter_queue -lnfnetlink

      - name: Compile arm
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi30-clang \
            -O2 -s -static \
            ttlq.c -o ttlq_arm \
            -lnetfilter_queue -lnfnetlink

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ttlq-binaries
          path: |
            ttlq_arm
            ttlq_arm64
